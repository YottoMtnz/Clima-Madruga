<style>

*{box-sizing:border-box;margin:0;padding:0}

#sky{display:none;position:fixed;inset:0;width:100%;height:100%}
.clear-d{--c1:#0b57c0;--c2:#3f9cf0;--c3:#bfe3ff}.clear-n{--c1:#04061a;--c2:#0e1a47;--c3:#2b2f70}
.cloudy-d{--c1:#4e6079;--c2:#7c92ad;--c3:#b6c4d4}.cloudy-n{--c1:#0d111c;--c2:#212a3d;--c3:#3a465c}
.rain-d{--c1:#263245;--c2:#3e4f66;--c3:#66778d}.rain-n{--c1:#080c15;--c2:#18202e;--c3:#2a3445}
.storm-d{--c1:#1a1f2d;--c2:#2d3547;--c3:#4a5368}.storm-n{--c1:#05070d;--c2:#121824;--c3:#222a3a}
.snow-d{--c1:#6784a6;--c2:#97b0cc;--c3:#c7d6e7}.snow-n{--c1:#18223c;--c2:#303f66;--c3:#58698f}

body{font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;color:#fff;min-height:100vh;min-height:100dvh;background:linear-gradient(175deg,var(--c1),var(--c2) 55%,var(--c3));background-attachment:fixed;transition:--c1 2.4s,--c2 2.4s,--c3 2.4s;text-shadow:0 1px 14px rgba(0,0,0,.22);overflow-x:hidden}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.wrap{position:relative;max-width:76rem;margin:0 auto;padding:max(1rem,env(safe-area-inset-top)) clamp(.9rem,3vw,1.6rem) max(3rem,env(safe-area-inset-bottom))}
/* ===== header ===== */
header{display:flex;gap:8px;align-items:center;position:relative;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.55rem;font-weight:800;letter-spacing:.01em;font-size:1.12rem;margin-right:.4rem;white-space:nowrap}
.brand svg{width:2rem;height:2rem;filter:drop-shadow(0 3px 8px rgba(0,0,0,.35))}
.brand small{display:block;font-weight:400;font-size:.62rem;opacity:.75;letter-spacing:.14em;text-transform:uppercase}
#sf{flex:1;display:flex;gap:8px;min-width:min(15rem,100%)}
input,button,select{font:inherit;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);border-radius:999px;padding:11px 18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);text-shadow:none}
input{flex:1;min-width:0}
input::placeholder{color:rgba(255,255,255,.72)}
button{cursor:pointer;transition:background .2s,transform .15s}
button:hover{background:rgba(255,255,255,.27)}
button:active{transform:scale(.96)}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
#sg{position:absolute;top:calc(100% + 6px);left:0;right:0;list-style:none;background:rgba(12,19,34,.96);border:1px solid var(--stroke);border-radius:16px;overflow:hidden;z-index:60;box-shadow:0 18px 40px rgba(0,0,0,.45)}
#sg:empty{display:none}
#sg li{padding:12px 18px;cursor:pointer}
#sg li:hover{background:rgba(255,255,255,.12)}
.hgroup{position:relative;flex:1;display:flex;min-width:min(15rem,100%)}
#st{min-height:1.4em;margin:10px 6px 0;font-size:.9rem;opacity:.88}
.pill{border-radius:999px;padding:11px 14px;font-weight:600}
/* ===== hero ===== */
#app{animation:appin 1.1s ease both}
@keyframes appin{from{opacity:0}}
.hero{padding:4.5vh 4px 3vh;position:relative}
.place{font-size:clamp(1.25rem,3.4vw,1.7rem);font-weight:600;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.clock{font-variant-numeric:tabular-nums;opacity:.85;font-size:.95rem;font-weight:400}
.date{opacity:.85;margin-top:2px;text-transform:capitalize}
.main{display:flex;align-items:center;gap:clamp(10px,3.5vw,34px);margin-top:1.5vh}
.temp{font-size:clamp(5.6rem,min(27vw,30vh),15rem);font-weight:200;line-height:.92;letter-spacing:-.045em}
.hico{width:clamp(5.2rem,15vw,9.5rem);height:auto;flex:none;filter:drop-shadow(0 10px 26px rgba(0,0,0,.3))}
.cond{font-size:clamp(1.5rem,4.4vw,2.3rem);font-weight:450;margin-top:1vh}
.hl{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.hl span{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);padding:6px 14px;border-radius:999px;backdrop-filter:blur(10px);font-size:.95rem}
@keyframes floaty{50%{transform:translateY(-12px)}}
.floaty{animation:floaty 6s ease-in-out infinite}
/* icon animations */
.ic .rays{transform-origin:12px 12px;animation:spin 26s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ic .drop{animation:fall 1.5s ease-in infinite}
.ic .drop.d2{animation-delay:.5s}.ic .drop.d3{animation-delay:1s}
@keyframes fall{0%{transform:translateY(0);opacity:0}25%{opacity:1}75%{opacity:1}100%{transform:translateY(3.2px);opacity:0}}
.ic .flake{animation:drift 2.6s ease-in-out infinite}
.ic .flake.f2{animation-delay:.8s}.ic .flake.f3{animation-delay:1.6s}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(.8px,2.6px)}}
.ic .bolt{animation:flick 2.8s linear infinite}
@keyframes flick{0%,55%,70%,100%{opacity:1}60%,65%{opacity:.25}}
.ic .fogln{animation:slide 3.4s ease-in-out infinite alternate}
@keyframes slide{from{transform:translateX(-1.4px)}to{transform:translateX(1.4px)}}
/* ===== ticker ===== */
.ticker{margin:8px 0 4px;border-block:1px solid rgba(255,255,255,.16);background:rgba(8,14,26,.22);backdrop-filter:blur(10px);overflow:hidden;border-radius:14px;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.ticker .tk{display:flex;gap:0;width:max-content;animation:tick 36s linear infinite;padding:9px 0}
.ticker:hover .tk{animation-play-state:paused}
@keyframes tick{to{transform:translateX(-50%)}}
.tk span{padding:0 1.1rem;white-space:nowrap;font-size:.93rem;opacity:.95}
.tk b{color:var(--acc);font-weight:600}
/* ===== layout cards ===== */
.grid{display:grid;gap:18px;margin-top:18px;grid-template-columns:1fr}
@media(min-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.span2{grid-column:span 2}}
.card{background:var(--glass);backdrop-filter:blur(22px) saturate(1.25);-webkit-backdrop-filter:blur(22px) saturate(1.25);border:1px solid var(--stroke);border-radius:28px;padding:22px 24px 24px;box-shadow:0 22px 44px rgba(2,6,18,.28);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent)}
.card h2{font-size:.98rem;font-weight:650;letter-spacing:.05em;text-transform:uppercase;opacity:.85;margin-bottom:14px;display:flex;align-items:center;gap:.5rem}
.card h2 .dot{width:.55rem;height:.55rem;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc)}
.rv{opacity:0;transform:translateY(26px) scale(.985)}
.rv.on{opacity:1;transform:none;transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
/* chart */
.seg{display:flex;gap:6px;margin-left:auto}
.seg button{padding:5px 13px;font-size:.85rem;border-radius:999px}
.seg button.act{background:var(--acc);color:#231a02;border-color:transparent;font-weight:700}
.chartscroll{overflow-x:auto;scrollbar-width:thin;padding-bottom:6px}
.chartin{min-width:730px}
.chartbox{position:relative}
.chartbox svg{width:100%;height:auto;display:block}
#tip{position:absolute;pointer-events:none;background:rgba(8,13,24,.92);border:1px solid var(--stroke);border-radius:12px;padding:7px 11px;font-size:.85rem;opacity:0;transition:opacity .15s;white-space:nowrap;z-index:5;box-shadow:0 10px 24px rgba(0,0,0,.4)}
.hrow{display:flex;margin-top:2px}
.hh{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.8rem;min-width:0}
.hh svg{width:1.35rem;height:1.35rem}
.hh em{font-style:normal;font-size:.72rem;color:#a8dcff;min-height:1em}
.hh b{font-weight:550}
/* gauges */
.gauges{display:grid;grid-template-columns:repeat(2,1fr);gap:20px 14px}
@media(min-width:560px){.gauges{grid-template-columns:repeat(4,1fr)}}
.gauge{text-align:center}
.gauge svg{width:100%;max-width:7.2rem;height:auto}
.gauge .gv{font-size:1.28rem;font-weight:550;margin-top:2px}
.gauge .gl{font-size:.85rem;opacity:.75}
.ring-bg{stroke:rgba(255,255,255,.14)}
.ring-fg{transition:stroke-dashoffset 1.4s cubic-bezier(.2,.7,.2,1)}
.needle{transition:transform 1.4s cubic-bezier(.2,.7,.2,1);transform-origin:60px 60px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:0 22px;margin-top:18px}
@media(min-width:560px){.tiles{grid-template-columns:repeat(4,1fr)}}
.t{padding:13px 0;border-top:1px solid rgba(255,255,255,.13)}
.t small{display:block;opacity:.72;font-size:.85rem}
.t b{font-size:1.32rem;font-weight:350}
/* astro */
.astro{display:grid;gap:8px}
@media(min-width:700px){.astro{grid-template-columns:1.25fr 1fr}}
.sunbox,.moonbox{background-color:var(--glass2);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:16px 18px;background-size:cover;background-position:center}
.sunbox{background-image:linear-gradient(rgba(5,10,20,.16),rgba(5,10,20,.40)),url('assets/sky-day.jpg')}
.moonbox{background-image:linear-gradient(rgba(5,10,20,.30),rgba(5,10,20,.55)),url('assets/sky-night.jpg')}
.sunbox h3,.moonbox h3{font-size:.9rem;font-weight:600;opacity:.85;margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase}
.suntimes{display:flex;justify-content:space-between;font-size:.9rem;margin-top:2px}
.suntimes b{display:block;font-size:1.08rem;font-weight:550}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chips span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:4px 11px;font-size:.82rem}
.moonrow{display:flex;gap:16px;align-items:center}
.moonrow .mv{font-size:1.6rem;font-weight:450}
.moonrow small{opacity:.75;display:block}
/* days */
.d{display:grid;grid-template-columns:3.4rem 2rem 2.6rem 1fr 2.6rem 1.4rem;align-items:center;gap:10px;padding:11px 4px;cursor:pointer;border-radius:14px;transition:background .2s}
.d:hover{background:rgba(255,255,255,.07)}
.d+.d{border-top:1px solid rgba(255,255,255,.11)}
.d svg{width:1.7rem;height:1.7rem}
.lw{opacity:.68;text-align:right}
.bar{height:7px;border-radius:7px;background:rgba(255,255,255,.16);position:relative;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;border-radius:7px;background:linear-gradient(90deg,#38bdf8,#a3e635,#fde68a,#fb923c,#ef4444);background-size:70rem 100%;transition:width 1s ease,left 1s ease}
.d .car{opacity:.6;transition:transform .35s;font-size:.8rem}
.d.open .car{transform:rotate(180deg)}
.ddet{grid-column:1/-1;display:none;padding:4px 2px 12px}
.d.open .ddet{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 18px;animation:appin .5s ease}
@media(min-width:560px){.ddet{grid-template-columns:repeat(4,1fr)!important}}
.ddet div small{display:block;opacity:.7;font-size:.8rem}
.ddet div b{font-weight:550}
.dpop{font-size:.78rem;color:#a8dcff;text-align:right}
/* radar */
#map{height:430px;border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.14);z-index:1}
.radarctl{display:flex;align-items:center;gap:10px;margin-top:12px}
.radarctl button{padding:7px 16px}
#rtime{font-variant-numeric:tabular-nums;opacity:.9;font-size:.92rem}
.leaflet-container{background:#0a1220;font:inherit}
/* footer */
footer{margin-top:30px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:.88rem}
footer button{padding:7px 13px;font-size:.88rem}
footer .cred{flex-basis:100%;margin-top:10px;opacity:.78;line-height:1.5}
footer .cred b{color:#fff}
@media(max-height:520px) and (orientation:landscape){.hero{padding:2vh 4px 2vh}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>

<script>

function tween(dur,fn){if(RM){fn(1);return}const t0=performance.now();(function s(t){const p=Math.min((t-t0)/dur,1);fn(1-Math.pow(1-p,3));if(p<1)requestAnimationFrame(s)})(t0)}
function render(){const t=L(),c=D.current,dl=D.daily,hr=D.hourly,day=!!c.is_day,[k,nc]=sceneOf(c.weather_code);
document.body.className=k+'-'+(day?'d':'n');setFx(k,day,nc,c.weather_code);$('un').textContent=U=='c'?'°C':'°F';$('lg').textContent=LANG==='es'?'EN':'ES';
document.documentElement.lang=LANG;$('tagline').textContent=t.tag;$('q').placeholder=t.ph;$('go').textContent=t.go;$('try').textContent=t.try;$('cred').innerHTML=t.cred;
const loc=LANG==='es'?'es':'en',nowD=new Intl.DateTimeFormat(loc,{timeZone:D.timezone,weekday:'long',day:'numeric',month:'long'}).format(new Date()),
i0=Math.max(0,hr.time.findIndex(x=>x.slice(0,13)>=c.time.slice(0,13))),
hs=hr.time.slice(i0,i0+24).map((x,i)=>({t:x,v:cv(hr.temperature_2m[i0+i]),c:hr.weather_code[i0+i],p:hr.precipitation_probability[i0+i]??0,d:hr.is_day?hr.is_day[i0+i]:1})),
wd8=t.dirs[Math.round(c.wind_direction_10m/45)%8],uv=dl.uv_index_max[0],uvl=uv<3?0:uv<6?1:uv<8?2:uv<11?3:4,
dew=hr.dew_point_2m?hr.dew_point_2m[i0]:null,vis=U=='c'?Math.min(c.visibility/1000,50).toFixed(0)+' km':Math.min(c.visibility/1609,31).toFixed(0)+' mi',
mi=moonInfo(placeNow()),srT=dl.sunrise[0].slice(11,16),ssT=dl.sunset[0].slice(11,16);
sunWin={sr:new Date(dl.sunrise[0]),ss:new Date(dl.sunset[0])};
const tk=[[t.feels,T(c.apparent_temperature)],[t.wind,wd8+' '+spd(c.wind_speed_10m)],[t.gst,spd(c.wind_gusts_10m)],[t.hum,c.relative_humidity_2m+'%'],[t.uv,Math.round(uv)+' '+t.uvl[uvl]],[t.pres,Math.round(c.pressure_msl)+' hPa'],[t.vis,vis],[t.cld,c.cloud_cover+'%'],[t.prb,(hr.precipitation_probability[i0]??0)+'%'],[t.prc,mmv(dl.precipitation_sum[0]||0)],[t.sr,srT],[t.ss,ssT]];
if(AQ&&AQ.us_aqi!=null)tk.push([t.aqi,Math.round(AQ.us_aqi)+' · '+aqiInfo(AQ.us_aqi)[0]]);
const ticker=tk.map(x=>`<span>${x[0]} <b>${x[1]}</b></span>`).join('<span style="opacity:.4">•</span>');
const lo10=Math.min(...dl.temperature_2m_min.map(cv)),hi10=Math.max(...dl.temperature_2m_max.map(cv)),sp10=(hi10-lo10)||1;
const days=dl.time.map((d,j)=>{const a=cv(dl.temperature_2m_min[j]),b=cv(dl.temperature_2m_max[j]),lp=(a-lo10)/sp10*100,wp=Math.max((b-a)/sp10*100,5),pp=dl.precipitation_probability_max?dl.precipitation_probability_max[j]:null;
return `<div class="d" data-j="${j}"><b>${j?(cap(new Date(d+'T12:00').toLocaleDateString(loc,{weekday:'short'})).replace('.','')):(LANG==='es'?'Hoy':'Today')}</b>${icon(dl.weather_code[j],1)}<span class="lw">${Math.round(a)}°</span><div class="bar"><i style="left:${lp}%;width:${wp}%;background-size:600px 100%;background-position:${-lp/100*600}px 0"></i></div><span>${Math.round(b)}°</span><span class="dpop">${pp!=null&&pp>=20?'💧'+pp+'%':''}</span><span class="car">▾</span>
<div class="ddet"><div><small>${t.sr}</small><b>${dl.sunrise[j].slice(11,16)}</b></div><div><small>${t.ss}</small><b>${dl.sunset[j].slice(11,16)}</b></div><div><small>${t.uv}</small><b>${Math.round(dl.uv_index_max[j])} ${t.uvl[Math.min(4,Math.floor(dl.uv_index_max[j]/3))]}</b></div><div><small>${t.prc}</small><b>${mmv(dl.precipitation_sum[j]||0)}</b></div><div><small>${t.prb}</small><b>${pp??'—'}%</b></div><div><small>${t.wind}</small><b>${spd(dl.wind_speed_10m_max[j])}</b></div><div><small>${t.gst}</small><b>${spd(dl.wind_gusts_10m_max[j])}</b></div><div><small>${t.dlen}</small><b>${fmtD(dl.daylight_duration[j]/60)}</b></div></div></div>`}).join('');
const C=2*Math.PI*52,uvFrac=Math.min(uv,11)/11,prFrac=Math.min(Math.max((c.pressure_msl-980)/60,0),1),golden=new Date(sunWin.ss.getTime()-36e5);
$('app').innerHTML=`
<section class="hero rv"><div class="place">📍 ${place.n} <span class="clock" id="clk"></span></div><div class="date">${cap(nowD)}</div>
<div class="main"><span class="temp" id="tv">${T(c.temperature_2m)}</span><span class="floaty">${icon(c.weather_code,day,'hico')}</span></div>
<div class="cond">${WTT()[c.weather_code]||''}</div>
<div class="hl"><span>${t.mx} ${T(dl.temperature_2m_max[0])}</span><span>${t.mn} ${T(dl.temperature_2m_min[0])}</span><span>${t.feels} ${T(c.apparent_temperature)}</span>${AQ&&AQ.us_aqi!=null?`<span>${t.aqi} ${aqiHTML()}</span>`:''}</div></section>
<div class="ticker rv"><div class="tk">${ticker}<span style="opacity:.4">•</span>${ticker}<span style="opacity:.4">•</span></div></div>
<div class="grid">
<section class="card span2 rv"><h2><span class="dot"></span>${t.next24}<span class="seg"><button id="bt" class="${chartMode=='t'?'act':''}">${t.ct}</button><button id="br" class="${chartMode=='r'?'act':''}">${t.cr}</button></span></h2>
<div class="chartscroll"><div class="chartin"><div class="chartbox" id="chartbox"><svg id="chartSvg" viewBox="0 0 ${hs.length*44} 196"></svg><div id="tip"></div></div>
<div class="hrow">${hs.map((h,i)=>`<div class="hh">${icon(h.c,h.d)}<b>${i?h.t.slice(11,16):t.now}</b><em>${h.p>=20?'💧'+h.p+'%':''}</em></div>`).join('')}</div></div></div></section>
<section class="card span2 rv"><h2><span class="dot"></span>${t.det}</h2>
<div class="gauges">
<div class="gauge"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" class="ring-bg" stroke-width="7"/><g font-size="11" fill="rgba(255,255,255,.75)" text-anchor="middle"><text x="60" y="17">N</text><text x="106" y="64">E</text><text x="60" y="112">S</text><text x="14" y="64">${LANG==='es'?'O':'W'}</text></g><g id="needle"><path d="M60 22 L66 62 L60 55 L54 62 Z" fill="#ffd166"/></g><circle cx="60" cy="60" r="5" fill="#fff"/></svg><div class="gv">${spd(c.wind_speed_10m)}</div><div class="gl">${t.wind} · ${wd8}</div></div>
<div class="gauge"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" class="ring-bg" stroke-width="9"/><circle id="humRing" cx="60" cy="60" r="52" fill="none" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle" fill="#fff" font-size="21" font-weight="600">${c.relative_humidity_2m}%</text></svg><div class="gv">${dew!=null?T(dew):'—'}</div><div class="gl">${t.hum} · ${t.dew}</div></div>
<div class="gauge"><svg viewBox="0 0 120 78"><defs><linearGradient id="uvg" x1="0" x2="1"><stop offset="0" stop-color="#4ade80"/><stop offset=".35" stop-color="#facc15"/><stop offset=".6" stop-color="#fb923c"/><stop offset=".85" stop-color="#f87171"/><stop offset="1" stop-color="#c084fc"/></linearGradient></defs><path d="M14 68 A46 46 0 0 1 106 68" fill="none" class="ring-bg" stroke-width="9"/><path id="uvArc" d="M14 68 A46 46 0 0 1 106 68" fill="none" stroke="url(#uvg)" stroke-width="9" stroke-linecap="round" stroke-dasharray="144.5" stroke-dashoffset="144.5"/><text x="60" y="66" text-anchor="middle" fill="#fff" font-size="21" font-weight="600">${Math.round(uv)}</text></svg><div class="gv">${t.uvl[uvl]}</div><div class="gl">${t.uv}</div></div>
<div class="gauge"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" class="ring-bg" stroke-width="9"/><circle id="prRing" cx="60" cy="60" r="52" fill="none" stroke="#2dd4bf" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle" fill="#fff" font-size="19" font-weight="600">${Math.round(c.pressure_msl)}</text></svg><div class="gv">hPa</div><div class="gl">${t.pres}</div></div>
</div>
<div class="tiles">
<div class="t"><small>${t.feels}</small><b>${T(c.apparent_temperature)}</b></div>
<div class="t"><small>${t.gst}</small><b>${spd(c.wind_gusts_10m)}</b></div>
<div class="t"><small>${t.vis}</small><b>${vis}</b></div>
<div class="t"><small>${t.cld}</small><b>${c.cloud_cover}%</b></div>
<div class="t"><small>${t.prb}</small><b>${hr.precipitation_probability[i0]??0}%</b></div>
<div class="t"><small>${t.prc}</small><b>${mmv(dl.precipitation_sum[0]||0)}</b></div>
<div class="t"><small>${t.aqi}</small><b id="aqiVal">${aqiHTML()}</b></div>
<div class="t"><small>${t.dew}</small><b>${dew!=null?T(dew):'—'}</b></div>
</div></section>
<section class="card rv"><h2><span class="dot"></span>${t.ast}</h2><div class="astro" style="grid-template-columns:1fr">
<div class="sunbox"><h3>☀️ ${t.sun}</h3>
<svg viewBox="0 0 220 128" style="width:100%;height:auto"><defs><linearGradient id="sung" x1="0" x2="1"><stop offset="0" stop-color="#fb923c"/><stop offset=".5" stop-color="#ffd166"/><stop offset="1" stop-color="#fb923c"/></linearGradient></defs><path id="sunarc" d="M16 112 A94 94 0 0 1 204 112" fill="none" stroke="url(#sung)" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 6"/><line x1="4" y1="112" x2="216" y2="112" stroke="rgba(255,255,255,.3)" stroke-width="1.5"/><circle id="sundot" cx="16" cy="112" r="8" fill="#ffd166" style="filter:drop-shadow(0 0 9px #ffd166)"/></svg>
<div class="suntimes"><span>${t.sr}<b>${srT}</b></span><span style="text-align:center">${t.noon}<b>${new Date((sunWin.sr.getTime()+sunWin.ss.getTime())/2).toTimeString().slice(0,5)}</b></span><span style="text-align:right">${t.ss}<b>${ssT}</b></span></div>
<div class="chips"><span>🕒 ${t.dlen}: ${fmtD(dl.daylight_duration[0]/60)}</span><span>🌇 ${t.gold}: ${golden.toTimeString().slice(0,5)}</span></div></div>
<div class="moonbox"><h3>🌙 ${t.moon}</h3><div class="moonrow">${moonSVG(mi.age)}<div><div class="mv">${t.phases[mi.idx]}</div><small>${t.ill}: ${Math.round(mi.ill*100)}% · ${t.age}: ${mi.age.toFixed(1)} d</small><small>${t.nf}: ~${Math.max(0,Math.round(mi.toFull))} d · ${t.nn}: ~${Math.round(mi.toNew)} d</small></div></div></div>
</div></section>
<section class="card rv"><h2><span class="dot"></span>${t.days}</h2>${days}</section>
<section class="card span2 rv"><h2><span class="dot"></span>${t.rad}</h2><div id="map"></div><div class="radarctl"><button id="rplay">${t.play}</button><span id="rtime"></span></div></section>
</div>`;
const sb=document.querySelector('.sunbox');if(sb){const f=(placeNow()-sunWin.sr)/(sunWin.ss-sunWin.sr),img=(f<-.12||f>1.12)?'assets/sky-night.jpg':(f<0||f>1||f>.82)?'assets/sky-dusk.jpg':'assets/sky-day.jpg';sb.style.backgroundImage=`linear-gradient(rgba(5,10,20,.16),rgba(5,10,20,.42)),url('${img}')`}
CD={hs,mode:chartMode};drawChart();
const cb=$('chartbox');cb.addEventListener('mousemove',chartTip);cb.addEventListener('touchmove',chartTip,{passive:true});cb.addEventListener('mouseleave',()=>{$('tip').style.opacity=0;const x=$('chx');if(x)x.setAttribute('opacity',0)});
$('bt').onclick=()=>{chartMode='t';CD.mode='t';$('bt').classList.add('act');$('br').classList.remove('act');drawChart()};
$('br').onclick=()=>{chartMode='r';CD.mode='r';$('br').classList.add('act');$('bt').classList.remove('act');drawChart()};
document.querySelectorAll('.d').forEach(r=>r.addEventListener('click',()=>r.classList.toggle('open')));
tween(1400,p=>{const nd=$('needle');if(nd)nd.setAttribute('transform',`rotate(${(c.wind_direction_10m+180)*p} 60 60)`);const hr2=$('humRing');if(hr2)hr2.style.strokeDashoffset=C*(1-(c.relative_humidity_2m/100)*p);const pr=$('prRing');if(pr)pr.style.strokeDashoffset=C*(1-prFrac*p);const ua=$('uvArc');if(ua)ua.style.strokeDashoffset=144.5*(1-uvFrac*p)});
if(first&&!RM){first=false;const el=$('tv'),to=cv(c.temperature_2m);tween(1200,p=>{el.textContent=Math.round(to*p)+'°'})}else first=false;
clearInterval(clockTimer);clockTimer=setInterval(tickClock,1000);tickClock();
const io=new IntersectionObserver(es=>es.forEach((e,i)=>{if(e.isIntersecting){e.target.style.transitionDelay=(i%3)*90+'ms';e.target.classList.add('on');io.unobserve(e.target)}}),{threshold:.06});
document.querySelectorAll('.rv').forEach(e=>io.observe(e));
const io2=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){initRadar();io2.disconnect()}}),{threshold:.15});const mp=$('map');if(mp)io2.observe(mp)}
</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ===== Radar RainViewer ===== */
let map=null,radarLayers=[],radarFrames=[],radarIdx=0,radarTimer=null,playing=false;
function initRadar(){const ML=window.L;if(!ML){const m=$('map');if(m)m.innerHTML='<p style="padding:1rem;opacity:.8">Radar no disponible / unavailable.</p>';return}
if(!map){map=ML.map('map',{scrollWheelZoom:false}).setView([place.lat,place.lon],7);
ML.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
ML.marker([place.lat,place.lon]).addTo(map);map.on('click',()=>map.scrollWheelZoom.enable());
$('rplay').onclick=toggleRadar;radarDone=true}
else map.setView([place.lat,place.lon],7);
loadRadarFrames()}
async function loadRadarFrames(){if(!map)return;try{const j=await(await fetch('https://api.rainviewer.com/public/weather-maps.json')).json();
const frames=[...(j.radar.past||[]),...(j.radar.nowcast||[])];if(!frames.length)return;
radarLayers.forEach(l=>map.removeLayer(l));
radarLayers=frames.map(f=>window.L.tileLayer(`https://tilecache.rainviewer.com${f.path}/256/{z}/{x}/{y}/2/1_1.png`,{opacity:0,zIndex:10,attribution:'Radar © RainViewer'}).addTo(map));
radarFrames=frames;radarIdx=radarLayers.length-1;showFrame(radarIdx)}catch(e){}}
function showFrame(i){radarLayers.forEach((l,j)=>l.setOpacity(j===i?.62:0));const f=radarFrames[i];if(f)$('rtime').textContent=new Date(f.time*1000).toLocaleTimeString(LANG==='es'?'es':'en',{hour:'2-digit',minute:'2-digit'})}
function toggleRadar(){playing=!playing;$('rplay').textContent=playing?L().pause:L().play;
if(playing){radarTimer=setInterval(()=>{radarIdx=(radarIdx+1)%radarLayers.length;showFrame(radarIdx)},800)}else clearInterval(radarTimer)}
/* ===== Eventos ===== */
const _load=load;load=async()=>{await _load();if(radarDone)initRadar()};
function pick(x){place={n:x.name+(x.admin1?', '+x.admin1:''),lat:x.latitude,lon:x.longitude};ls.set('pl',JSON.stringify(place));$('sg').innerHTML='';$('q').value='';load()}
$('sf').onsubmit=async e=>{e.preventDefault();const q=$('q').value.trim();if(!q)return;
try{const j=await(await fetch(`https://geocoding-api.open-meteo.com/v1/search?count=5&language=${LANG}&name=`+encodeURIComponent(q))).json();sgR=j.results||[];
if(!sgR.length){st(L().nf2);return}
if(sgR.length==1)pick(sgR[0]);else $('sg').innerHTML=sgR.map((x,i)=>`<li data-i="${i}">${x.name}${x.admin1?', '+x.admin1:''}, ${x.country||''}</li>`).join('')}
catch(err){st(L().nsearch)}};
$('sg').onclick=e=>{const li=e.target.closest('li');if(li)pick(sgR[li.dataset.i])};
document.addEventListener('click',e=>{if(!e.target.closest('.hgroup'))$('sg').innerHTML=''});
$('loc').onclick=()=>{if(!navigator.geolocation)return st(L().nogeo);st(L().geoloc);
navigator.geolocation.getCurrentPosition(async p=>{place={n:L().myloc,lat:p.coords.latitude,lon:p.coords.longitude};
try{const j=await(await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${place.lat}&longitude=${place.lon}&localityLanguage=${LANG}`)).json();const c=j.city||j.locality;if(c)place.n=c+(j.principalSubdivision?', '+j.principalSubdivision:'')}catch(e){}
ls.set('pl',JSON.stringify(place));load()},()=>st(L().noloc),{timeout:8000})};
$('un').onclick=()=>{U=U=='c'?'f':'c';ls.set('u',U);if(D)render()};
$('lg').onclick=()=>{LANG=LANG==='es'?'en':'es';ls.set('lg',LANG);buildDemo();if(D)render();else{$('tagline').textContent=L().tag;$('q').placeholder=L().ph;$('go').textContent=L().go;$('try').textContent=L().try;$('cred').innerHTML=L().cred}};
function buildDemo(){$('demo').innerHTML='';L().scenes.forEach(([lb,c,d])=>{const b=document.createElement('button');b.type='button';b.textContent=lb;b.onclick=()=>{D=mkDemo(c,d);st(L().demo);render()};$('demo').append(b,' ')});
const rb=document.createElement('button');rb.type='button';rb.textContent=L().real;rb.onclick=()=>load();$('demo').append(rb)}
buildDemo();load();
</script>
</body>
